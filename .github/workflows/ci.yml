name: CI & Skill Package

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: uv sync
      - name: Lint with ruff
        run: uv run ruff check src tests
      - name: Run unit tests
        run: uv run pytest -v
      - name: Smoke test CLI
        run: |
          uv run awh --version
          uv run awh presets
          uv run awh features
      - name: Smoke test Windows launcher (awh.cmd)
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          awh.cmd --version
          awh.cmd presets
          awh.cmd features
      - name: Smoke test macOS launcher (awh.sh)
        if: runner.os == 'macOS'
        run: |
          ./awh.sh --version
          ./awh.sh presets
          ./awh.sh features

  package-skill:
    name: Build Skill ZIP
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Package clean Skill ZIP
        run: |
          mkdir -p dist/apple-watch-health
          cp -r SKILL.md README.md LICENSE pyproject.toml uv.lock awh.sh awh.cmd sandboxes references src dist/apple-watch-health/
          find dist/apple-watch-health -name '__pycache__' -exec rm -rf {} +
          (cd dist && zip -rq apple-watch-health-skill.zip apple-watch-health)
          ls -lh dist/apple-watch-health-skill.zip
      - uses: actions/upload-artifact@v4
        with:
          name: apple-watch-health-skill
          path: dist/apple-watch-health-skill.zip
      - name: Attach ZIP to GitHub Release on Tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/apple-watch-health-skill.zip
          generate_release_notes: true
