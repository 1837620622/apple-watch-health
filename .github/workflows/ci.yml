name: CI & Skill Package

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: uv sync --frozen
      - name: Lint with ruff
        run: uv run ruff check src tests
      - name: Run unit tests
        run: uv run pytest -v
      - name: Smoke test CLI
        run: |
          uv run awh --version
          uv run awh presets
          uv run awh features
      - name: Smoke test Windows launcher (awh.cmd)
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          awh.cmd --version
          awh.cmd presets
          awh.cmd features
      - name: Smoke test macOS launcher (awh.sh)
        if: runner.os == 'macOS'
        run: |
          ./awh.sh --version
          ./awh.sh presets
          ./awh.sh features

  package-skill:
    name: Build & Verify Skill ZIP
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Package clean Skill ZIP
        run: |
          mkdir -p dist/apple-watch-health
          cp -r SKILL.md README.md CHANGELOG.md LICENSE .gitattributes pyproject.toml uv.lock awh.sh awh.cmd assets references src dist/apple-watch-health/
          chmod +x dist/apple-watch-health/awh.sh
          find dist/apple-watch-health -name '__pycache__' -exec rm -rf {} +
          (cd dist && zip -rq apple-watch-health-skill.zip apple-watch-health)
          (cd dist && sha256sum apple-watch-health-skill.zip > apple-watch-health-skill.zip.sha256)
          ls -lh dist/apple-watch-health-skill.zip dist/apple-watch-health-skill.zip.sha256
          cat dist/apple-watch-health-skill.zip.sha256
      - name: Audit Skill ZIP integrity, permissions, line endings and zero secrets
        run: |
          unzip -tq dist/apple-watch-health-skill.zip
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          import zipfile, sys

          with zipfile.ZipFile("dist/apple-watch-health-skill.zip") as zf:
              names = zf.namelist()
              forbidden = (".p7b", ".pk8", ".apk", ".key", ".pem", ".der", "__pycache__", ".venv")
              bad = [n for n in names if any(tok in n for tok in forbidden)]
              if bad:
                  sys.exit(f"Forbidden files in ZIP: {bad}")

              svgs = [n for n in names if n.endswith(".svg")]
              if not svgs:
                  sys.exit("Missing assets/*.svg in Skill ZIP")
              for s in svgs:
                  ET.fromstring(zf.read(s))

              sh_info = zf.getinfo("apple-watch-health/awh.sh")
              sh_mode = (sh_info.external_attr >> 16) & 0o777
              if (sh_mode & 0o111) == 0:
                  sys.exit(f"awh.sh is not executable in ZIP (mode={oct(sh_mode)})")
              sh_bytes = zf.read(sh_info)
              if b"\r\n" in sh_bytes:
                  sys.exit("awh.sh contains CRLF line endings")

              cmd_bytes = zf.read("apple-watch-health/awh.cmd")
              if b"\r\n" not in cmd_bytes or (cmd_bytes.count(b"\n") != cmd_bytes.count(b"\r\n")):
                  sys.exit("awh.cmd must use CRLF line endings")

              print(f"ZIP audit passed: {len(names)} entries, {len(svgs)} SVGs verified, awh.sh mode={oct(sh_mode)}.")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: apple-watch-health-skill
          path: |
            dist/apple-watch-health-skill.zip
            dist/apple-watch-health-skill.zip.sha256
      - name: Attach ZIP to GitHub Release on Tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/apple-watch-health-skill.zip
            dist/apple-watch-health-skill.zip.sha256
          generate_release_notes: true
