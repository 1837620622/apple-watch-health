[project]
name = "apple-watch-health"
version = "2.2.0"
description = "Cross-platform (macOS & Windows) local USB iAP2 accessory-location toolkit & AI Agent Skill for Apple Watch regional health feature testing and diagnostics"
readme = "README.md"
license = "GPL-3.0-only"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "cryptography>=43.0.0",
    "pymobiledevice3>=11.0.0",
    "pywin32>=306; sys_platform == 'win32'",
]

[project.scripts]
awh = "apple_watch_health.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.9.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/apple_watch_health"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]
