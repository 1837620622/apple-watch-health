<svg xmlns="http://www.w3.org/2000/svg" width="960" height="320" viewBox="0 0 960 320" role="img" aria-label="小白 5 步解锁国行 Apple Watch 高血压通知流程图">
  <defs>
    <marker id="arrowG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#059669"/>
    </marker>
    <style>
      .t { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
    </style>
  </defs>

  <rect x="2" y="2" width="956" height="316" rx="16" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
  <text x="28" y="38" class="t" font-size="18" font-weight="700" fill="#0F172A">场景二：小白 5 步开启 Apple Watch 高血压通知（免开发者模式 · iAP2 硬件通道）</text>
  <line x1="28" y1="52" x2="932" y2="52" stroke="#E2E8F0" stroke-width="1"/>

  <!-- Step 1 -->
  <g transform="translate(28, 70)">
    <rect x="0" y="0" width="164" height="156" rx="12" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.2"/>
    <rect x="12" y="12" width="52" height="22" rx="6" fill="#059669"/>
    <text x="38" y="27" class="t" font-size="11.5" font-weight="700" fill="#FFFFFF" text-anchor="middle">第 1 步</text>
    <text x="12" y="54" class="t" font-size="13.5" font-weight="700" fill="#0F172A">环境与手表体检</text>
    <text x="12" y="75" class="t" font-size="11.5" fill="#475569">确认识别出 iPhone</text>
    <text x="12" y="93" class="t" font-size="11.5" fill="#475569">和 S9–S12 / Ultra 2+</text>
    <text x="12" y="111" class="t" font-size="11.5" fill="#475569">且系统为 iOS 26+</text>
    <rect x="12" y="124" width="140" height="22" rx="5" fill="#0F172A"/>
    <text x="82" y="139" class="mono" font-size="11.5" fill="#6EE7B7" text-anchor="middle">awh doctor</text>
  </g>
  <line x1="192" y1="148" x2="210" y2="148" stroke="#059669" stroke-width="2" marker-end="url(#arrowG)"/>

  <!-- Step 2 -->
  <g transform="translate(214, 70)">
    <rect x="0" y="0" width="164" height="156" rx="12" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.2"/>
    <rect x="12" y="12" width="52" height="22" rx="6" fill="#059669"/>
    <text x="38" y="27" class="t" font-size="11.5" font-weight="700" fill="#FFFFFF" text-anchor="middle">第 2 步</text>
    <text x="12" y="54" class="t" font-size="13.5" font-weight="700" fill="#0F172A">取身份 &amp; 测握手</text>
    <text x="12" y="75" class="t" font-size="11.5" fill="#475569">3 秒提取 ~68 KB 身份</text>
    <text x="12" y="93" class="t" font-size="11.5" fill="#475569">测试看到认证通过：</text>
    <text x="12" y="111" class="mono" font-size="9.5" fill="#047857">authentication_succeeded</text>
    <rect x="12" y="124" width="140" height="22" rx="5" fill="#0F172A"/>
    <text x="82" y="139" class="mono" font-size="11" fill="#6EE7B7" text-anchor="middle">awh setup &amp; probe</text>
  </g>
  <line x1="378" y1="148" x2="396" y2="148" stroke="#059669" stroke-width="2" marker-end="url(#arrowG)"/>

  <!-- Step 3 -->
  <g transform="translate(400, 70)">
    <rect x="0" y="0" width="164" height="156" rx="12" fill="#ECFDF5" stroke="#6EE7B7" stroke-width="1.2"/>
    <rect x="12" y="12" width="52" height="22" rx="6" fill="#059669"/>
    <text x="38" y="27" class="t" font-size="11.5" font-weight="700" fill="#FFFFFF" text-anchor="middle">第 3 步</text>
    <text x="12" y="54" class="t" font-size="13.5" font-weight="700" fill="#065F46">推香港硬件坐标</text>
    <text x="12" y="75" class="t" font-size="11.5" fill="#334155">保持终端窗口运行</text>
    <text x="12" y="93" class="t" font-size="11.5" fill="#334155">不要拔掉 USB 线</text>
    <text x="12" y="111" class="t" font-size="11.5" fill="#047857">默认 20 分钟自动停</text>
    <rect x="12" y="124" width="140" height="22" rx="5" fill="#0F172A"/>
    <text x="82" y="139" class="mono" font-size="11" fill="#6EE7B7" text-anchor="middle">awh send --preset hk</text>
  </g>
  <line x1="564" y1="148" x2="582" y2="148" stroke="#059669" stroke-width="2" marker-end="url(#arrowG)"/>

  <!-- Step 4 -->
  <g transform="translate(586, 70)">
    <rect x="0" y="0" width="174" height="156" rx="12" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1.2"/>
    <rect x="12" y="12" width="82" height="22" rx="6" fill="#2563EB"/>
    <text x="53" y="27" class="t" font-size="11.5" font-weight="700" fill="#FFFFFF" text-anchor="middle">第 4 步 · 关键</text>
    <text x="12" y="54" class="t" font-size="13.5" font-weight="700" fill="#1E3A8A">手机端离线开通</text>
    <text x="12" y="74" class="t" font-size="11.5" fill="#334155">1) 开飞行模式关 Wi-Fi/流量</text>
    <text x="12" y="92" class="t" font-size="11.5" fill="#334155">2) 关定位等 10 秒再重开</text>
    <text x="12" y="110" class="t" font-size="11.5" fill="#334155">3) 点 Apple 地图定位箭头</text>
    <text x="12" y="128" class="t" font-size="11.5" fill="#1D4ED8">4) 重进健康核对清单开启</text>
    <text x="12" y="145" class="t" font-size="11" fill="#475569">(仍灰显则先关机手表再试)</text>
  </g>
  <line x1="760" y1="148" x2="778" y2="148" stroke="#059669" stroke-width="2" marker-end="url(#arrowG)"/>

  <!-- Step 5 -->
  <g transform="translate(782, 70)">
    <rect x="0" y="0" width="150" height="156" rx="12" fill="#FFFBEB" stroke="#FCD34D" stroke-width="1.2"/>
    <rect x="12" y="12" width="52" height="22" rx="6" fill="#D97706"/>
    <text x="38" y="27" class="t" font-size="11.5" font-weight="700" fill="#FFFFFF" text-anchor="middle">第 5 步</text>
    <text x="12" y="54" class="t" font-size="13.5" font-weight="700" fill="#78350F">恢复真定位 &amp; 清场</text>
    <text x="12" y="75" class="t" font-size="11.5" fill="#475569">关飞行模式并拔 USB</text>
    <text x="12" y="93" class="t" font-size="11.5" fill="#475569">确认显示「通知已打开」</text>
    <text x="12" y="111" class="t" font-size="11.5" fill="#92400E">勿手关(30天基线期)</text>
    <rect x="12" y="124" width="126" height="22" rx="5" fill="#0F172A"/>
    <text x="75" y="139" class="mono" font-size="10.5" fill="#FDE68A" text-anchor="middle">awh restore &amp; clean</text>
  </g>

  <!-- Bottom crucial reminder -->
  <rect x="28" y="242" width="904" height="60" rx="10" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
  <text x="44" y="266" class="t" font-size="13" font-weight="700" fill="#0F172A">小白防踩坑提醒：</text>
  <text x="164" y="266" class="t" font-size="12.5" fill="#334155">① 第 4 步必须开启「设置 → 定位服务 → 系统服务 → 系统自定义」且严禁连国内 Wi-Fi/蜂窝流量。</text>
  <text x="44" y="290" class="t" font-size="12.5" fill="#334155">② 睡眠呼吸暂停、ECG、血氧、心律不齐与房颤历史大陆均已官方开放无需改定位；心律不齐与房颤历史互斥，未确诊房颤请保留心律不齐。</text>
</svg>
