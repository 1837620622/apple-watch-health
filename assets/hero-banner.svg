<svg xmlns="http://www.w3.org/2000/svg" width="960" height="270" viewBox="0 0 960 270" role="img" aria-label="Apple Watch Health (awh) 跨平台 USB 双引擎定位与健康功能工具">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F8FAFC"/>
    </linearGradient>
    <linearGradient id="accentBar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <clipPath id="cardClip">
      <rect x="2" y="2" width="956" height="266" rx="16"/>
    </clipPath>
    <style>
      .t { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
    </style>
  </defs>

  <!-- Outer card with crisp border (high contrast on both GitHub light & dark themes) -->
  <rect x="2" y="2" width="956" height="266" rx="16" fill="url(#bgGrad)" stroke="#CBD5E1" stroke-width="1.5"/>
  <!-- Top accent bar neatly clipped to card rounded corners -->
  <rect x="2" y="2" width="956" height="6" fill="url(#accentBar)" clip-path="url(#cardClip)"/>

  <!-- Subtle architectural grid lines in top-right corner -->
  <g stroke="#E2E8F0" stroke-width="1" opacity="0.65">
    <line x1="760" y1="24" x2="936" y2="24"/>
    <line x1="790" y1="54" x2="936" y2="54"/>
    <line x1="820" y1="84" x2="936" y2="84"/>
    <line x1="850" y1="24" x2="850" y2="120"/>
    <line x1="895" y1="24" x2="895" y2="120"/>
  </g>

  <!-- Left geometric emblem: iPhone + Location Pin + Watch Health pulse -->
  <g transform="translate(36, 44)">
    <rect x="0" y="0" width="92" height="92" rx="22" fill="#0F172A"/>
    <!-- Watch / Device frame -->
    <rect x="20" y="18" width="38" height="56" rx="9" fill="none" stroke="#E2E8F0" stroke-width="2.5"/>
    <line x1="33" y1="24" x2="45" y2="24" stroke="#94A3B8" stroke-width="2" stroke-linecap="round"/>
    <!-- ECG / Health pulse line -->
    <polyline points="24,49 31,49 35,38 40,58 45,45 49,49 54,49" fill="none" stroke="#34D399" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Location pin badge on top-right of emblem -->
    <circle cx="66" cy="28" r="14" fill="#2563EB" stroke="#0F172A" stroke-width="3"/>
    <path d="M66 20 C62.5 20 60 22.6 60 25.8 C60 30.2 66 36 66 36 C66 36 72 30.2 72 25.8 C72 22.6 69.5 20 66 20 Z" fill="#FFFFFF"/>
    <circle cx="66" cy="25.6" r="2.2" fill="#2563EB"/>
  </g>

  <!-- Main Title & Subtitle -->
  <text x="150" y="80" class="t" font-size="34" font-weight="700" fill="#0F172A">Apple Watch Health</text>
  <rect x="488" y="54" width="66" height="30" rx="8" fill="#EFF6FF" stroke="#BFDBFE" stroke-width="1"/>
  <text x="521" y="74" class="mono" font-size="16" font-weight="700" fill="#1D4ED8" text-anchor="middle">awh</text>

  <text x="150" y="112" class="t" font-size="16" font-weight="600" fill="#334155">不越狱 · 免 Root · 永久免费开源的 macOS &amp; Windows USB 双引擎工具 &amp; AI Agent Skill</text>

  <!-- Two core capability highlight strips -->
  <g transform="translate(150, 130)">
    <rect x="0" y="0" width="382" height="58" rx="10" fill="#EFF6FF" stroke="#BFDBFE" stroke-width="1"/>
    <circle cx="18" cy="21" r="5" fill="#2563EB"/>
    <text x="31" y="25" class="t" font-size="14" font-weight="700" fill="#1E3A8A">① iPhone 全局修改定位 &amp; GPX 轨迹</text>
    <text x="31" y="45" class="t" font-size="12" fill="#334155">微信 / 地图开 Wi-Fi 全生效 · 高德百度纠偏 · 一键恢复</text>

    <rect x="396" y="0" width="382" height="58" rx="10" fill="#ECFDF5" stroke="#A7F3D0" stroke-width="1"/>
    <circle cx="414" cy="21" r="5" fill="#059669"/>
    <text x="427" y="25" class="t" font-size="14" font-weight="700" fill="#065F46">② 解锁国行 Apple Watch 健康功能</text>
    <text x="427" y="45" class="t" font-size="12" fill="#334155">USB 外置 MFi 硬件 GPS 通道 · 实测开通高血压通知</text>
  </g>

  <!-- Bottom native local badge strip (zero external dependency, never breaks) -->
  <g transform="translate(36, 212)">
    <rect x="0" y="0" width="114" height="32" rx="8" fill="#0F172A"/>
    <text x="57" y="21" class="mono" font-size="13" font-weight="600" fill="#FFFFFF" text-anchor="middle">v2.4.1 Latest</text>

    <rect x="124" y="0" width="152" height="32" rx="8" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1"/>
    <text x="200" y="21" class="t" font-size="13" font-weight="600" fill="#0F172A" text-anchor="middle">macOS &amp; Windows</text>

    <rect x="286" y="0" width="136" height="32" rx="8" fill="#ECFDF5" stroke="#A7F3D0" stroke-width="1"/>
    <text x="354" y="21" class="t" font-size="13" font-weight="600" fill="#065F46" text-anchor="middle">GPL-3.0 开源免费</text>

    <rect x="432" y="0" width="112" height="32" rx="8" fill="#EFF6FF" stroke="#BFDBFE" stroke-width="1"/>
    <text x="488" y="21" class="mono" font-size="13" font-weight="600" fill="#1D4ED8" text-anchor="middle">Python 3.11+</text>

    <rect x="554" y="0" width="166" height="32" rx="8" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1"/>
    <text x="637" y="21" class="t" font-size="13" font-weight="600" fill="#334155" text-anchor="middle">AI Agent Skill 即装即用</text>

    <rect x="730" y="0" width="158" height="32" rx="8" fill="#FFFBEB" stroke="#FDE68A" stroke-width="1"/>
    <text x="809" y="21" class="t" font-size="13" font-weight="600" fill="#92400E" text-anchor="middle">纯本地 USB · 零上传</text>
  </g>
</svg>
