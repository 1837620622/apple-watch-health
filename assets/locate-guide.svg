<svg xmlns="http://www.w3.org/2000/svg" width="960" height="310" viewBox="0 0 960 310" role="img" aria-label="小白 4 步全局改定位与高德百度纠偏流程图">
  <defs>
    <marker id="arrowB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563EB"/>
    </marker>
    <style>
      .t { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
    </style>
  </defs>

  <rect x="2" y="2" width="956" height="306" rx="16" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
  <text x="28" y="38" class="t" font-size="18" font-weight="700" fill="#0F172A">场景一：小白 4 步全局改定位（微信 / 苹果地图 / 高德 / GPX 路线通用）</text>
  <line x1="28" y1="52" x2="932" y2="52" stroke="#E2E8F0" stroke-width="1"/>

  <!-- 4 Steps -->
  <!-- Step 1 -->
  <g transform="translate(28, 70)">
    <rect x="0" y="0" width="206" height="146" rx="12" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.2"/>
    <rect x="14" y="14" width="58" height="24" rx="6" fill="#2563EB"/>
    <text x="43" y="30" class="t" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">第 1 步</text>
    <text x="14" y="60" class="t" font-size="14" font-weight="700" fill="#0F172A">插线 &amp; 开开发者模式</text>
    <text x="14" y="82" class="t" font-size="12" fill="#475569">USB 线连电脑，手机点【信任】</text>
    <text x="14" y="102" class="t" font-size="12" fill="#475569">设置里找不到开关？先跑：</text>
    <rect x="14" y="112" width="178" height="22" rx="5" fill="#0F172A"/>
    <text x="103" y="127" class="mono" font-size="11.5" fill="#93C5FD" text-anchor="middle">awh devmode --reveal</text>
  </g>
  <line x1="234" y1="143" x2="256" y2="143" stroke="#2563EB" stroke-width="2.2" marker-end="url(#arrowB)"/>

  <!-- Step 2 -->
  <g transform="translate(262, 70)">
    <rect x="0" y="0" width="206" height="146" rx="12" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1.2"/>
    <rect x="14" y="14" width="58" height="24" rx="6" fill="#2563EB"/>
    <text x="43" y="30" class="t" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">第 2 步</text>
    <text x="14" y="60" class="t" font-size="14" font-weight="700" fill="#1E3A8A">一行命令定位过去</text>
    <text x="14" y="82" class="t" font-size="12" fill="#334155">支持 75+ 城市、高德/百度坐标</text>
    <text x="14" y="102" class="t" font-size="12" fill="#334155">或 --gpx 路线 + --jitter 漂移</text>
    <rect x="12" y="112" width="182" height="22" rx="5" fill="#0F172A"/>
    <text x="103" y="127" class="mono" font-size="11" fill="#6EE7B7" text-anchor="middle">awh locate --place 纽约</text>
  </g>
  <line x1="468" y1="143" x2="490" y2="143" stroke="#2563EB" stroke-width="2.2" marker-end="url(#arrowB)"/>

  <!-- Step 3 -->
  <g transform="translate(496, 70)">
    <rect x="0" y="0" width="206" height="146" rx="12" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.2"/>
    <rect x="14" y="14" width="58" height="24" rx="6" fill="#059669"/>
    <text x="43" y="30" class="t" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">第 3 步</text>
    <text x="14" y="60" class="t" font-size="14" font-weight="700" fill="#0F172A">后台守护 · 全 App 生效</text>
    <text x="14" y="82" class="t" font-size="12" fill="#475569">开着 Wi-Fi / 5G 照常使用微信</text>
    <text x="14" y="102" class="t" font-size="12" fill="#475569">保持 USB 连接，随时查进度：</text>
    <rect x="14" y="112" width="178" height="22" rx="5" fill="#0F172A"/>
    <text x="103" y="127" class="mono" font-size="11.5" fill="#E2E8F0" text-anchor="middle">awh status</text>
  </g>
  <line x1="702" y1="143" x2="724" y2="143" stroke="#2563EB" stroke-width="2.2" marker-end="url(#arrowB)"/>

  <!-- Step 4 -->
  <g transform="translate(730, 70)">
    <rect x="0" y="0" width="202" height="146" rx="12" fill="#FFFBEB" stroke="#FCD34D" stroke-width="1.2"/>
    <rect x="14" y="14" width="58" height="24" rx="6" fill="#D97706"/>
    <text x="43" y="30" class="t" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">第 4 步</text>
    <text x="14" y="60" class="t" font-size="14" font-weight="700" fill="#78350F">用完一键回真实 GPS</text>
    <text x="14" y="82" class="t" font-size="12" fill="#475569">发官方 stopLocationSimulation</text>
    <text x="14" y="102" class="t" font-size="12" fill="#475569">零系统残留，无需重启手机：</text>
    <rect x="14" y="112" width="174" height="22" rx="5" fill="#0F172A"/>
    <text x="101" y="127" class="mono" font-size="11.5" fill="#FDE68A" text-anchor="middle">awh restore</text>
  </g>

  <!-- Bottom coordinate conversion explanation card -->
  <rect x="28" y="232" width="904" height="60" rx="10" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
  <text x="44" y="256" class="t" font-size="13" font-weight="700" fill="#0F172A">精准不偏移秘籍（对标爱思助手纠偏）：</text>
  <text x="282" y="256" class="t" font-size="12.5" fill="#334155">高德 / 腾讯 / 微信坐标加</text>
  <rect x="430" y="241" width="144" height="22" rx="5" fill="#EFF6FF" stroke="#BFDBFE"/>
  <text x="502" y="256" class="mono" font-size="11.5" font-weight="700" fill="#1D4ED8" text-anchor="middle">--coord-type gcj02</text>
  <text x="584" y="256" class="t" font-size="12.5" fill="#334155">，百度地图坐标加</text>
  <rect x="692" y="241" width="136" height="22" rx="5" fill="#ECFDF5" stroke="#A7F3D0"/>
  <text x="760" y="256" class="mono" font-size="11.5" font-weight="700" fill="#047857" text-anchor="middle">--coord-type bd09</text>
  <text x="44" y="280" class="t" font-size="12" fill="#475569">直接粘贴高德/百度拾取器复制的「经度,纬度」（如 116.3974,39.9092）也会自动识别翻转并转为 WGS-84，彻底告别 500 米火星偏移（港澳台及海外无需加）。</text>
</svg>
